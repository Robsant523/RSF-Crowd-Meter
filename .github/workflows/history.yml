name: Collect history and deploy
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rsf-history
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect a reading
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Save history
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record RSF occupancy'
            git push origin HEAD:main
          fi
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html history.js sw.js manifest.json icon-192.png icon-512.png _site/
          cp -r data _site/
          cp history.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Report sensor failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Sensor collection failed; deployed the existing history without adding a reading.'
          exit 1
