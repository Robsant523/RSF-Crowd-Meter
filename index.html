<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F2">
<script>
(function () {
  let saved;
  try { saved = localStorage.getItem('rsf-theme'); } catch (_) {}
  const system = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved === 'light' || saved === 'dark' ? saved : system ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111111' : '#F2F2F2';
})();
</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RSF Crowd">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>RSF crowd meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F2F2F2; --card: #FFFFFF; --border: #D4D4D4; --border-soft: #EAEAEA;
    --text: #171717; --text-dim: #595959; --text-faint: #666666;
    --accent: #222222; --on-accent: #FFFFFF; --track: #E5E5E5;
    --chart-fill: rgba(0,0,0,0.07); --shadow: 0 18px 60px rgba(0,0,0,0.05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111111; --card: #1B1B1B; --border: #3D3D3D; --border-soft: #2A2A2A;
    --text: #F3F3F3; --text-dim: #B8B8B8; --text-faint: #A6A6A6;
    --accent: #E8E8E8; --on-accent: #171717; --track: #383838;
    --chart-fill: rgba(255,255,255,0.09); --shadow: 0 18px 60px rgba(0,0,0,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    padding-top: max(40px, env(safe-area-inset-top));
  }
  button, input { font: inherit; }
  button { min-height: 44px; }
  .theme-toggle { display: flex; align-items: center; gap: 7px; border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; background: var(--card); color: var(--text); font-size: 12px; cursor: pointer; flex-shrink: 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  #root { width: 100%; max-width: 460px; }
  .history-note { color: var(--text-dim); font-size: 12px; line-height: 1.6; margin: 8px 0 14px; }
  .days { display: flex; gap: 4px; margin: 16px 0; }
  .days button { flex: 1; min-width: 0; padding: 10px 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; }
  .days button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .history-hour { display: grid; grid-template-columns: 43px 1fr 38px 46px; align-items: center; gap: 8px; margin: 9px 0; font-size: 12px; }
  .history-hour small { color: var(--text-dim); font-size: 10px; }
  .history-track { height: 12px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .history-track div { height: 100%; min-width: 2px; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script src="history.js"></script>
<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const ThemeContext = React.createContext('light');

const SPACE_URL = 'https://api.density.io/v2/spaces/spc_863128347956216317/count';
const TOKEN = 'shr_o69HxjQ0BYrY2FPD9HxdirhJYcFDCeRolEd744Uj88e';
const CAPACITY = 140;
const RSF_PAGE = 'https://recwell.berkeley.edu/facilities/recreational-sports-facility-rsf/rsf-weight-room-crowd-meter/';
const HISTORY_URL = './history.json';

function statusFor(pct) {
  const label = pct < 30 ? 'quiet' : pct < 60 ? 'moderate' : pct < 95 ? 'busy' : 'near capacity';
  return { label, color: 'var(--accent)', bg: 'var(--border-soft)' };
}

function CircleGauge({ pct, color }) {
  const size = 260;
  const stroke = 18;
  const r = (size - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct));
  const offset = circumference * (1 - clamped / 100);

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--track)" strokeWidth={stroke} />
      <circle
        cx={size/2} cy={size/2} r={r} fill="none"
        stroke={color} strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={circumference}
        strokeDashoffset={offset}
        style={{ transition: 'stroke-dashoffset 0.7s ease, stroke 0.4s ease' }}
      />
    </svg>
  );
}

function Row({ k, v }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderTop: '1px solid var(--border-soft)', fontSize: 13 }}>
      <span style={{ color: 'var(--text-dim)', letterSpacing: 0.5 }}>{k}</span>
      <span style={{ fontWeight: 500 }}>{v}</span>
    </div>
  );
}

function LiveView() {
  const [count, setCount] = useState(null);
  const [pct, setPct] = useState(0);
  const [state, setState] = useState('loading');
  const [updated, setUpdated] = useState(null);
  const intervalRef = useRef(null);

  const fetchCount = useCallback(async () => {
    setState((s) => (s === 'error' ? 'loading' : s));
    try {
      const res = await fetch(SPACE_URL, { headers: { Authorization: 'Bearer ' + TOKEN } });
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      const c = data.count;
      if (!Number.isInteger(c) || c < 0) throw new Error('Invalid count');
      setCount(c);
      setPct((c / CAPACITY) * 100);
      setUpdated(new Date());
      setState('live');
    } catch (e) {
      setState('error');
    }
  }, []);

  useEffect(() => {
    fetchCount();
    intervalRef.current = setInterval(fetchCount, 60000);
    return () => clearInterval(intervalRef.current);
  }, [fetchCount]);

  const s = statusFor(pct);

  return (
    <div>
      <div style={{ padding: '30px 22px 8px', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        {state === 'error' ? (
          <div style={{ textAlign: 'center', color: 'var(--text-dim)', fontSize: 13, lineHeight: 1.6, padding: '24px 6px' }}>
            Live data couldn't load directly (the sensor API blocks cross-origin requests from some hosts).
            <br /><br />
            <a href={RSF_PAGE} target="_blank" rel="noopener" style={{ color: 'var(--accent)' }}>Open the official live meter &#8594;</a>
          </div>
        ) : (
          <React.Fragment>
            <div style={{ position: 'relative', width: 260, height: 260 }}>
              <CircleGauge pct={pct} color={s.color} />
              <div style={{
                position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center'
              }}>
                <div style={{ fontFamily: "'Inter', system-ui, sans-serif", fontSize: 58, fontWeight: 700, letterSpacing: -3, lineHeight: 1, color: s.color }}>
                  {state === 'loading' ? '--' : Math.round(pct)}%
                </div>
                <div style={{ fontSize: 12, letterSpacing: 2, textTransform: 'uppercase', color: 'var(--text-dim)', marginTop: 6, fontWeight: 300 }}>
                  of capacity
                </div>
              </div>
            </div>
            <div style={{
              marginTop: 16, padding: '6px 16px', borderRadius: 20, fontSize: 12,
              letterSpacing: 1.5, textTransform: 'uppercase', background: s.bg, color: s.color
            }}>
              {state === 'loading' ? 'connecting' : s.label}
            </div>
          </React.Fragment>
        )}

        <div style={{ width: '100%', marginTop: 20 }}>
          <Row k="People inside" v={count === null ? '--' : count} />
          <Row k="Approx capacity" v="140" />
          <Row k="95% capacity line" v={state !== 'live' ? 'unavailable' : pct >= 95 ? 'virtual queue active' : 'not active'} />
        </div>
        <div style={{ fontSize: 11, color: 'var(--text-faint)', textAlign: 'center', marginTop: 12, letterSpacing: 0.5 }}>
          {updated ? `Updated ${updated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'Not yet updated'}
        </div>
      </div>

      <div style={{ padding: '14px 22px 20px', display: 'flex', gap: 10, alignItems: 'center', justifyContent: 'space-between' }}>
        <button
          onClick={fetchCount}
          style={{
            background: 'var(--border-soft)', border: '1px solid var(--border)', color: 'var(--text)',
            fontFamily: "'Inter', system-ui, sans-serif", fontSize: 12, letterSpacing: 1, textTransform: 'uppercase',
            padding: '9px 14px', borderRadius: 8, cursor: 'pointer'
          }}
        >
          {state === 'loading' ? 'Refreshing…' : 'Refresh now'}
        </button>
        <a href={RSF_PAGE} target="_blank" rel="noopener" style={{ fontSize: 11, color: 'var(--text-faint)', textDecoration: 'none' }}>
          Official RecWell page &#8594;
        </a>
      </div>
    </div>
  );
}

function ChartCanvas({ entries }) {
  const theme = React.useContext(ThemeContext);
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current) return;
    const css = getComputedStyle(document.documentElement);
    const color = name => css.getPropertyValue(name).trim();
    const labels = entries.map((e) => new Date(e.t).toLocaleString([], { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }));
    const values = entries.map((e) => e.pct);

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: values,
          borderColor: color('--accent'),
          backgroundColor: color('--chart-fill'),
          fill: true,
          pointRadius: 0,
          borderWidth: 2,
          tension: 0.25
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { min: 0, max: 100, ticks: { color: color('--text-dim') }, grid: { color: color('--border-soft') } },
          x: { ticks: { color: color('--text-dim'), maxTicksLimit: 6 }, grid: { color: color('--border-soft') } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [entries, theme]);

  return <canvas ref={canvasRef} style={{ width: '100%', height: 220 }} />;
}

function HistoryPanel({ entries }) {
  const [day, setDay] = useState(RSFHistory.parts(new Date()).day);
  const hours = RSFHistory.summarize(entries.map(e => ({ at: new Date(e.t).toISOString(), count: e.count })), day);
  return <section aria-labelledby="history-heading" style={{ padding: '0 0 22px', borderBottom: '1px solid var(--border)', marginBottom: 24 }}>
    <h2 id="history-heading" style={{ fontSize: 22, fontWeight: 500 }}>Plan your visit</h2>
    <p className="history-note">Hourly averages · last 8 weeks · Berkeley time</p>
    <div className="days" role="group" aria-label="Day of week">
      {RSFHistory.days.map(d => <button key={d} aria-pressed={day === d} onClick={() => setDay(d)}>{d}</button>)}
    </div>
    {hours.every(h => h.days === 0) && <p className="history-note">No readings for {day} yet. History builds as collection runs.</p>}
    <div className="history-hours">
      {hours.map(h => <div className="history-hour" key={h.hour}>
        <span>{RSFHistory.hourLabel(h.hour)}</span>
        <div className="history-track" aria-hidden="true">{h.days > 0 && <div style={{ width: `${Math.min(100, h.average / CAPACITY * 100)}%`, background: statusFor(h.average / CAPACITY * 100).color }} />}</div>
        <span>{h.days ? `${Math.round(h.average / CAPACITY * 100)}%` : '—'}</span>
        <small>{h.days ? `${h.days} ${h.days === 1 ? 'day' : 'days'}` : 'No data'}</small>
      </div>)}
    </div>
    <p className="history-note">Bars show average occupancy as a percentage of 140 people. Each recorded date has equal weight. One day is an early reading, not an established pattern. Missing readings are never treated as zero.</p>
    <p className="history-note">Includes all hours; zero can mean the gym was closed. Check the official RecWell page for opening hours. Past counts do not guarantee current availability.</p>
  </section>;
}


function HistoryView() {
  const [history, setHistory] = useState(null);
  const [error, setError] = useState(false);
  const [partial, setPartial] = useState(false);
  const [range, setRange] = useState(1); // days
  const [lookupTime, setLookupTime] = useState('');

  useEffect(() => {
    let disposed = false;
    async function load() {
      const results = await Promise.allSettled([HISTORY_URL, './data/history.json'].map(async url => {
        const r = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(20000) });
        if (!r.ok) throw new Error('History unavailable');
        return RSFHistory.normalize(await r.json());
      }));
      if (disposed) return;
      const good = results.filter(r => r.status === 'fulfilled');
      setPartial(good.length === 1);
      if (!good.length) { setError(true); return; }
      setHistory(RSFHistory.merge(good.map(r => r.value)));
      setError(false);
    }
    load();
    const timer = setInterval(load, 300000);
    return () => { disposed = true; clearInterval(timer); };
  }, []);

  const filtered = useMemo(() => {
    if (!history) return [];
    const cutoff = Date.now() - range * 24 * 60 * 60 * 1000;
    return history.filter((e) => e.t >= cutoff).sort((a, b) => a.t - b.t);
  }, [history, range]);

  const stats = useMemo(() => {
    if (filtered.length === 0) return null;
    const values = filtered.map((e) => e.pct);
    const avg = Math.round(values.reduce((a, b) => a + b, 0) / values.length);
    const peak = Math.round(Math.max(...values));
    return { avg, peak, count: filtered.length };
  }, [filtered]);

  const lookupResult = useMemo(() => {
    if (!history || !lookupTime) return null;
    const target = new Date(lookupTime).getTime();
    if (isNaN(target)) return null;
    let best = null, bestDiff = Infinity;
    for (const e of history) {
      const diff = Math.abs(e.t - target);
      if (diff < bestDiff) { best = e; bestDiff = diff; }
    }
    if (!best) return null;
    return { entry: best, diffMinutes: Math.round(bestDiff / 60000) };
  }, [history, lookupTime]);

  if (error && !history) {
    return (
      <div style={{ padding: '30px 22px', textAlign: 'center', color: 'var(--text-dim)', fontSize: 13, lineHeight: 1.6 }}>
        History could not load. Check your connection and try reopening this tab. It also retries automatically every five minutes.
      </div>
    );
  }

  if (!history) {
    return <div style={{ padding: '30px 22px', textAlign: 'center', color: 'var(--text-dim)', fontSize: 13 }}>Loading history…</div>;
  }

  return (
    <div style={{ padding: '22px' }}>
      {error && <p role="status" className="history-note">Refresh failed. Showing the last loaded history.</p>}
      {partial && <p role="status" className="history-note">One history source could not load. Showing available readings.</p>}
      {history.length > 0 && Date.now() - history[history.length - 1].t > 3600000 && <p className="history-note">Collection is behind. Last reading: {new Date(history[history.length - 1].t).toLocaleString('en-US', { timeZone: 'America/Los_Angeles' })} Pacific.</p>}
      <HistoryPanel entries={history} />
      <h2 style={{ fontSize: 20, marginBottom: 12 }}>Recent readings · Pacific time</h2>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        {[1, 7, 30].map((d) => (
          <button
            key={d}
            onClick={() => setRange(d)}
            style={{
              flex: 1, padding: '8px 0', borderRadius: 8, cursor: 'pointer',
              fontFamily: "'Inter', system-ui, sans-serif", fontSize: 12, letterSpacing: 1, textTransform: 'uppercase',
              background: range === d ? 'var(--accent)' : 'var(--border-soft)',
              color: range === d ? 'var(--on-accent)' : 'var(--text-dim)',
              border: '1px solid var(--border)'
            }}
          >
            {d === 1 ? '24h' : d + 'd'}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', color: 'var(--text-dim)', fontSize: 13, padding: '20px 0' }}>No samples in this window yet.</div>
      ) : (
        <React.Fragment>
          <ChartCanvas entries={filtered} />
          {stats && (
            <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
              <StatBox label="average" value={stats.avg + '%'} />
              <StatBox label="peak" value={stats.peak + '%'} />
              <StatBox label="samples" value={stats.count} />
            </div>
          )}
        </React.Fragment>
      )}

      <div style={{ marginTop: 26 }}>
        <div style={{ fontSize: 12, letterSpacing: 1.5, textTransform: 'uppercase', color: 'var(--text-dim)', marginBottom: 8 }}>
          How full was it? (your device’s local time)
        </div>
        <input
          type="datetime-local"
          value={lookupTime}
          onChange={(e) => setLookupTime(e.target.value)}
          style={{
            width: '100%', padding: '10px 12px', borderRadius: 8, border: '1px solid var(--border)',
            background: 'var(--border-soft)', color: 'var(--text)', fontFamily: "'Inter', system-ui, sans-serif", fontSize: 13
          }}
        />
        {lookupResult && (
          <div style={{ marginTop: 10, fontSize: 13, color: 'var(--text-dim)', lineHeight: 1.6 }}>
            Closest reading: <span style={{ color: 'var(--accent)', fontWeight: 500 }}>{lookupResult.entry.pct}% full</span>
            {' '}({lookupResult.entry.count} people) at {new Date(lookupResult.entry.t).toLocaleString()}
            {lookupResult.diffMinutes > 30 && (
              <div style={{ fontSize: 11, color: 'var(--text-faint)', marginTop: 4 }}>
                (nearest sample was {lookupResult.diffMinutes} min from the time you picked)
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function StatBox({ label, value }) {
  return (
    <div style={{ flex: 1, background: 'var(--border-soft)', borderRadius: 10, padding: '10px 0', textAlign: 'center' }}>
      <div style={{ fontFamily: "'Inter', system-ui, sans-serif", fontSize: 22, color: 'var(--accent)' }}>{value}</div>
      <div style={{ fontSize: 10, letterSpacing: 1, textTransform: 'uppercase', color: 'var(--text-faint)', marginTop: 2 }}>{label}</div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('live');
  const [theme, setTheme] = useState(document.documentElement.dataset.theme);
  function toggleTheme() {
    const next = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    document.querySelector('meta[name="theme-color"]').content = next === 'dark' ? '#111111' : '#F2F2F2';
    try { localStorage.setItem('rsf-theme', next); } catch (_) {}
    setTheme(next);
  }

  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }, []);

  return (
    <ThemeContext.Provider value={theme}>
    <div style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 24, boxShadow: 'var(--shadow)', overflow: 'hidden' }}>
      <div style={{ padding: '18px 22px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <div style={{ fontFamily: "'Inter', system-ui, sans-serif", fontSize: 24, fontWeight: 800, letterSpacing: -1, color: 'var(--accent)' }}>RSF</div>
          <div style={{ fontSize: 12, letterSpacing: 1, color: 'var(--text-dim)', marginTop: 2 }}>weight room crowd meter</div>
        </div>
        <button className="theme-toggle" type="button" role="switch" aria-checked={theme === 'dark'} aria-label="Dark mode" onClick={toggleTheme}>
          <span aria-hidden="true">{theme === 'dark' ? '☾' : '☀'}</span>
          {theme === 'dark' ? 'Dark' : 'Light'}
        </button>
      </div>

      <div style={{ display: 'flex', margin: '16px 22px 0', borderBottom: '1px solid var(--border)' }}>
        {['live', 'history'].map((t) => (
          <button
            key={t}
            onClick={() => setTab(t)}
            style={{
              flex: 1, padding: '10px 0', background: 'none', border: 'none', cursor: 'pointer',
              fontFamily: "'Inter', system-ui, sans-serif", fontSize: 12, letterSpacing: 1.5, textTransform: 'uppercase',
              color: tab === t ? 'var(--accent)' : 'var(--text-faint)',
              borderBottom: tab === t ? '2px solid var(--accent)' : '2px solid transparent',
              marginBottom: -1
            }}
          >
            {t}
          </button>
        ))}
      </div>

      {tab === 'live' ? <LiveView /> : <HistoryView />}
    </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
